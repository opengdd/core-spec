<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embedded OpenGDD authoring tool</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/authoring-tool/authoring.css?v=6d328337d265">
<link rel="stylesheet" href="/authoring-tool/src/workbench/workbench.css?v=6d328337d265">
<style>html,body,#workbench{height:100%;margin:0} body{overflow:hidden}</style>
<script type="importmap">
{
  "imports": {
    "opengdd-analysis": "/authoring-tool/lib/lang/tools/src/analysis.mjs?v=6d328337d265",
    "opengdd-syntax": "/authoring-tool/lib/opengdd/conformance/package-syntax.mjs?v=6d328337d265",
    "opengdd-file-map-host": "/authoring-tool/lib/opengdd/conformance/file-map-host.mjs?v=6d328337d265",
    "opengdd-migrate": "/authoring-tool/lib/opengdd/conformance/migrate.mjs?v=6d328337d265",
    "opengdd-validation": "/authoring-tool/lib/opengdd/conformance/validate-core.mjs?v=6d328337d265",
    "opengdd-authoring-version": "/authoring-tool/src/version.mjs?v=6d328337d265"
  }
}
</script>
</head>
<body>
<div id="workbench" class="opengdd-workbench opengdd-author-theme--light"></div>
<script type="module">
import { mountWorkbenchShell } from "/authoring-tool/src/workbench/shell.mjs?v=6d328337d265";
import { createScaffoldPackage } from "/authoring-tool/src/package.mjs?v=6d328337d265";
import panels from "/authoring-tool/panels/index.mjs?v=6d328337d265";

const schemaNames = [
  "manifest.schema.json", "tuning.schema.json", "personalization.schema.json",
  "collection.schema.json", "direction.schema.json", "opengdd-build.schema.json",
  "clocks.schema.json"
];
const schemas = async () => Object.fromEntries(await Promise.all(schemaNames.map(async name => {
  const response = await fetch("/schema/core/v0.9/" + name);
  if (!response.ok) throw new Error("Could not load schema " + name);
  return [name, await response.json()];
})));
const listed = { id: "harbour-lights", title: "Harbour Lights", revision: "embed-1" };

mountWorkbenchShell(document.querySelector("#workbench"), {
  panels,
  schemas,
  defaultPackageId: listed.id,
  listPackages: () => [listed],
  loadPackage(id) {
    if (id !== listed.id) throw new Error("Unknown package: " + id);
    return createScaffoldPackage(listed.id, listed.title);
  },
  readerUrl: null,
  contractsCatalogUrl: "/contracts/",
  showTheme: false
});
</script>
</body>
</html>
