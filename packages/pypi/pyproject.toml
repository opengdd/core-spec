[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opengdd"
version = "0.0.0"
description = "OpenGDD — an open format for game design documents. Registry placeholder; see opengdd.org."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Starphase Lab", email = "steward@opengdd.org" }]
keywords = ["opengdd", "gdd", "game-design-document", "game-design", "specification"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://opengdd.org/"
Repository = "https://github.com/opengdd/core-spec"
Issues = "https://github.com/opengdd/core-spec/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/opengdd"]
